<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Portfolio</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages redirection script
      var pathSegmentsToKeep = 0; // Set to 0 for user/organization pages (chatzikys.github.io)
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/") +
          (l.search ? "&" + l.search.slice(1) : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
